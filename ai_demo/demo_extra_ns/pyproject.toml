[project]
name = "demo-extra-ns"
version = "0.1.0"
description = "Second independent pipen namespace package (generalisation check)"
requires-python = ">=3.9"
dependencies = ["pipen>=1.2"]

[project.entry-points.pipen_cli_run]
demo_extra_ns = "demo_extra_ns"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_extra_ns"]
